#cloud-config
#
# Shared base cloud-config for every devbox-managed project VM. Ships with devbox
# itself (provision.py/cloudconfig.py resolve devbox's files via
# Path(__file__).parent, so it works out of the box under
# `uv tool install --editable .`) and is merged with the project's own optional
# .devbox/cloud-config.yaml before being handed to the provider. See devbox's
# README for the merge algorithm.
#
# This template covers only genuine first-boot cloud-init concerns: the login
# user, a baseline of packages the base mods lean on, and the BASH_ENV wiring.
# The actual provisioning is modular "mods" (jj, dotfiles, Claude Code, repo
# bootstrap, and a project's own): devbox injects the driver + resolved mods +
# env into write_files, and a runcmd invokes the driver - both appended at
# render time by cloudconfig.render_cloud_config (single source of truth with
# `devbox provision`, which runs the identical set over SSH).
#
# %DEVBOX_USER%, %DEVBOX_SSH_PUBKEY% (the only tokens left in this file) are
# substituted by literal %TOKEN% replacement (not {{...}}, which collides with
# cloud-init's own jinja syntax and with valid YAML flow-mapping syntax) BEFORE
# this file is parsed as YAML - this comment itself is stripped during that
# parse, and devbox prepends a fresh #cloud-config header to the merged result.
# The mods receive their context via the environment, NOT %TOKEN%s.

package_update: true
package_upgrade: false

packages:
  - zsh              # %DEVBOX_USER%'s login shell (must exist by first login)
  - vim
  - python3          # used by the `jimpo` oh-my-zsh theme's prompt_pwd
  - curl
  - git
  - git-lfs          # gitconfig declares the lfs clean/smudge filters
  - ca-certificates
  - gh               # GitHub CLI; also used as git's HTTPS credential helper
  - rsync            # receiver for `devbox sync` (host->box file push)

# `- default` also creates the cloud image's default `ubuntu` user (key-only,
# no password) as a fallback; %DEVBOX_USER% is the account you actually log
# in as.
users:
  - default
  - name: "%DEVBOX_USER%"
    groups: [sudo]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /usr/bin/zsh
    lock_passwd: true
    ssh_authorized_keys:
      - "%DEVBOX_SSH_PUBKEY%"

write_files:
  # Make provisioned tools (jj / claude / a project's own rustup, etc.)
  # available to NON-interactive bash (e.g. Claude Code's Bash tool). PAM
  # exports BASH_ENV from /etc/environment into the user's shells. The
  # referenced file is written by the provisioning driver, which runs after
  # %DEVBOX_USER%'s home directory exists (the write_files module runs before
  # the users module, so we can't write directly into $HOME here).
  - path: /etc/environment
    append: true
    content: |
      BASH_ENV=/home/%DEVBOX_USER%/.bash_env

  # devbox appends the provisioning payload here at render time: the driver, the
  # resolved mod scripts (mods/<name>.sh), context.env, an optional 0600
  # secret.env, and the manifest - all under /usr/local/lib/devbox-provision.
  # A runcmd (also injected at render time) then runs the driver as %DEVBOX_USER%.
