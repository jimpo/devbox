#cloud-config
#
# Shared base provisioning for every devbox-managed project VM. Ships with
# devbox itself (devbox.py resolves this file via Path(__file__).parent, so
# it works out of the box under `uv tool install --editable .`) and is
# merged with the project's own optional .devbox/cloud-config.yaml before
# being handed to virt-install. See devbox's README for the merge algorithm.
#
# This template only covers what MUST happen on first boot via cloud-init
# modules (packages, the login user, BASH_ENV). The actual provisioning body
# (jj, dotfiles, Claude Code, repo bootstrap) lives in the standalone,
# re-runnable provision-common.sh; devbox.py substitutes its tokens and
# injects it into write_files below at render time, and runcmd runs it. The
# same script is re-run over SSH by `devbox provision`.
#
# %DEVBOX_USER%, %DEVBOX_SSH_PUBKEY% (the only tokens left in this file) are
# substituted by literal %TOKEN% replacement (not {{...}}, which collides
# with cloud-init's own jinja syntax and with valid YAML flow-mapping syntax)
# BEFORE this file is parsed as YAML - this comment itself is stripped during
# that parse, and devbox prepends a fresh #cloud-config header to the merged
# result.

package_update: true
package_upgrade: false

packages:
  - zsh
  - vim
  - python3          # used by the `jimpo` oh-my-zsh theme's prompt_pwd
  - curl
  - git
  - git-lfs          # gitconfig declares the lfs clean/smudge filters
  - ca-certificates
  - gh               # GitHub CLI; also used as git's HTTPS credential helper

# `- default` also creates the cloud image's default `ubuntu` user (key-only,
# no password) as a fallback; %DEVBOX_USER% is the account you actually log
# in as.
users:
  - default
  - name: "%DEVBOX_USER%"
    groups: [sudo]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /usr/bin/zsh
    lock_passwd: true
    ssh_authorized_keys:
      - "%DEVBOX_SSH_PUBKEY%"

write_files:
  # Make provisioned tools (jj / claude / a project's own rustup, etc.)
  # available to NON-interactive bash (e.g. Claude Code's Bash tool). PAM
  # exports BASH_ENV from /etc/environment into the user's shells. The
  # referenced file is written by provision-common.sh, which runs after
  # %DEVBOX_USER%'s home directory exists (the write_files module runs
  # before the users module, so we can't write directly into $HOME here).
  - path: /etc/environment
    append: true
    content: |
      BASH_ENV=/home/%DEVBOX_USER%/.bash_env

  # devbox.py appends a second write_files entry here at render time:
  # /usr/local/bin/provision-common.sh, the token-substituted contents of
  # the standalone provision-common.sh. It's a neutral, root-owned location
  # (the dev user's home doesn't exist yet at write_files time); runcmd below
  # runs it as %DEVBOX_USER% once that home exists.

runcmd:
  - [ runuser, -l, "%DEVBOX_USER%", -c,
      "bash /usr/local/bin/provision-common.sh 2>&1 | tee /home/%DEVBOX_USER%/provision.log" ]
