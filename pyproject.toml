[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devbox"
version = "0.1.0"
description = "Global, multi-workspace dev-sandbox manager (libvirt + AWS)"
requires-python = ">=3.11"
dependencies = ["boto3[crt]>=1.34"]

[project.scripts]
devbox = "devbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["devbox"]

# Every non-Python data file devbox resolves at runtime via Path(__file__).parent
# lives INSIDE the package, so `packages` above carries it and this build needs
# no per-file entry: `devbox/init-script.sh`, `devbox/provision-driver.sh`, the
# built-in mods (`devbox/mods/*.sh` and `devbox/mods/*.nix`) and the
# home-manager flake skeleton (`devbox/nix/`). Adding a mod or a module is one
# new file and no build change.

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
