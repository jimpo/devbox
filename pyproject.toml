[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devbox"
version = "0.1.0"
description = "Global, multi-project dev-sandbox manager (libvirt + AWS)"
requires-python = ">=3.11"
dependencies = ["boto3[crt]>=1.34"]

[project.scripts]
devbox = "devbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["devbox"]

# Non-Python data files shipped inside the package (resolved at runtime via
# Path(__file__).parent).
[tool.hatch.build.targets.wheel.force-include]
"devbox/init-script.sh" = "devbox/init-script.sh"
"devbox/provision-driver.sh" = "devbox/provision-driver.sh"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
